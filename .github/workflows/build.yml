name: Build extension bundles

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build release bundles
        run: npm run build:zip

      - name: Exercise PowerShell compatibility wrappers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build-chrome.ps1 -Zip
          ./build-firefox.ps1 -Zip

      - name: Run focused unit tests
        run: npm test

      - name: Lint Firefox bundle with web-ext
        run: npm run lint:firefox

      - name: Validate expected outputs
        run: npm run validate:build

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-chrome-bundle
          path: |
            dist/chrome
            dist/blocknsfw-chrome.zip

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-firefox-bundle
          path: |
            dist/firefox
            dist/blocknsfw-firefox.zip
